# Vendored code in third_party/ directories stays byte-identical to upstream.
exclude: (^|/)third_party/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: pretty-format-json
        args: ["--autofix", "--indent=4", "--no-sort-keys"]
        files: ^examples/

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
        exclude: (^|/)third_party/

  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: cppcheck
        exclude: (^|/)third_party/
        additional_dependencies: ["cppcheck==1.5.1"]
        args:
          - "--language=c++"
          - "--std=c++20"
          - "--enable=warning,performance,portability"
          - "--suppress=missingInclude"
          - "--include=terraingen/util/portable.h"
          - "-U__SLANG__"
          - "--suppress=passedByValue:terraingen/noise/*"
          - "--suppress=normalCheckLevelMaxBranches"
          - "--suppress=floatConversionOverflow:terraingen/python/src/noise.cpp"
          - "--suppress=floatConversionOverflow:terraingen/python/src/mesh.cpp"
          - "--suppress=assignBoolToPointer:terraingen/python/src/*"
          - "--suppress=syntaxError:terraingen/gpu/metal.cpp"
          - "--error-exitcode=1"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: ["pyyaml>=5.1"]
