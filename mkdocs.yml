      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Contributing: contributing.md
      - Changelog: changelog.md
      - Citing: citing.md
  - Guides:
      - guides/index.md
      - Tools:
          - guides/tools/index.md
          - Command line: guides/tools/command-line.md
          - GUI: guides/tools/gui.md
      - Workflows:
          - guides/workflows/index.md
          - Customize TerrainGen: guides/workflows/customize-terraingen.md
  - Concepts:
      - concepts/index.md
      - Surfaces and bodies: concepts/surfaces.md
      - Sources: concepts/sources.md
      - Layers: concepts/layers.md
      - Evaluation: concepts/evaluation.md
      - GPU acceleration: concepts/gpu.md
      - Configuration: concepts/configuration.md
      - Customization: concepts/customization.md
  - Features:
      - features/index.md
      - Relief:
          - features/relief/index.md
          - Fractal noise: features/relief/noise.md
          - Roughness: features/relief/roughness.md
          - Spectral continuation: features/relief/spectral-continuation.md
          - Upsampling: features/relief/upsampling.md
      - Distributions:
          - features/distributions/index.md
          - Size-frequency distributions: features/distributions/size-frequency.md
          - Production functions: features/distributions/production.md
          - Equilibrium densities: features/distributions/equilibrium.md
          - Chronologies: features/distributions/chronology.md
          - Combining distributions: features/distributions/combining.md
          - Sampling and placement: features/distributions/sampling.md
          - Value distributions: features/distributions/value-distributions.md
      - Craters:
          - features/craters/index.md
          - Populations: features/craters/populations.md
          - Ages: features/craters/ages.md
          - Profiles: features/craters/profiles.md
          - Degradation: features/craters/degradation.md
          - Irregular outlines: features/craters/irregularity.md
          - Secondaries and rays: features/craters/secondaries-and-rays.md
          - Texture and slopes: features/craters/texture-and-slopes.md
          - Placement and blending: features/craters/placement-and-blending.md
          - Crater lists: features/craters/crater-lists.md
      - Boulders:
          - features/boulders/index.md
          - Size distributions: features/boulders/size-distributions.md
          - Placement: features/boulders/placement.md
          - Shapes and 3D models: features/boulders/shapes.md
          - Burial and exposure: features/boulders/burial-and-exposure.md
          - Fragmentation: features/boulders/fragmentation.md
          - Lists and meshes: features/boulders/lists-and-meshes.md
      - Albedo:
          - features/albedo/index.md
          - Base maps: features/albedo/base-maps.md
          - Slopes and maturity: features/albedo/slopes.md
          - Crater ejecta and rays: features/albedo/crater-rays.md
          - Reflectance zones: features/albedo/reflectance-zones.md
          - Splotches: features/albedo/splotches.md
          - Blast zones: features/albedo/blast-zones.md
          - Rocks: features/albedo/rocks.md
          - Photometry: features/albedo/photometry.md
      - Aeolian and geologic features:
          - features/geology/index.md
          - Dunes: features/geology/dunes.md
          - Ripples and bedforms: features/geology/bedforms.md
          - Sand fill and sand shadows: features/geology/sand.md
          - Strata: features/geology/strata.md
          - Pavement: features/geology/pavement.md
      - Outputs: features/outputs.md
  - Gallery: gallery/index.md
  - Reference:
      - Python API: api/python.md
      - C++ API: api/cpp.md
      - Bibliography: reference/bibliography.md

plugins:
  - search
  - glightbox:
      loop: true
      background: none
      shadow: false
  - mkdoxy:
      projects:
        cpp:
          # The library's public headers, as installed; the Python bindings and the app are not
          # part of the C++ API.
          src-dirs: >-
            terraingen/util terraingen/raster terraingen/noise terraingen/gpu terraingen/random
            terraingen/mesh terraingen/distribution terraingen/sources terraingen/layers
            terraingen/albedo terraingen/pipeline terraingen/config
          full-doc: true
          doxy-cfg:
            FILE_PATTERNS: "*.h"
            RECURSIVE: true
            EXTRACT_ALL: true
            JAVADOC_AUTOBRIEF: true
            # Includes as users write them: "terraingen/layers/layer.h".
            FULL_PATH_NAMES: true
            STRIP_FROM_PATH: .
            STRIP_FROM_INC_PATH: .
      save-api: .mkdoxy
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # The built package: the module's stubs (nanobind's stubgen) beside its Python files.
          paths: [build/python]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: alphabetical
            group_by_category: true
            show_category_heading: false
            summary: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 88
            merge_init_into_class: true
            show_if_no_docstring: true
            show_bases: true
            # Public names only: no private or special members such as __doc__ or __module__,
            # apart from constructors, merged into their class.
            filters: ["!^_", "^__init__$"]
