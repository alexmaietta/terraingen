site_name: TerrainGen
site_description: An open-source scientific terrain generation suite for planetary surfaces
site_author: Alex Maietta
site_url: https://alexmaietta.github.io/terraingen/
repo_url: https://github.com/alexmaietta/terraingen
repo_name: GitHub
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  Makefile
  README.md
  requirements.txt
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false

extra_css:
  - css/extra.css

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Command line: getting-started/command-line.md
      - GUI: getting-started/gui.md
  - Concepts: concepts/index.md
  - Guides: guides/index.md
  - Validation: validation/index.md
  - API:
      - Python: api/python.md
      - C++: api/cpp.md

plugins:
  - search
  - mkdoxy:
      projects:
        cpp:
          # The library's public headers, as installed; the Python bindings and the app are not
          # part of the C++ API.
          src-dirs: >-
            terraingen/util terraingen/raster terraingen/noise terraingen/gpu terraingen/random
            terraingen/meshes terraingen/distribution terraingen/sources terraingen/layers
            terraingen/filters terraingen/albedo terraingen/bodies terraingen/pipeline
          full-doc: true
          doxy-cfg:
            FILE_PATTERNS: "*.h"
            RECURSIVE: true
            EXTRACT_ALL: true
            JAVADOC_AUTOBRIEF: true
            # Includes as users write them: "terraingen/layers/layer.h".
            FULL_PATH_NAMES: true
            STRIP_FROM_PATH: .
            STRIP_FROM_INC_PATH: .
      save-api: .mkdoxy
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # The built package: the module's stubs (nanobind's stubgen) beside its Python files.
          paths: [build/python]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: alphabetical
            group_by_category: true
            show_category_heading: false
            summary: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 88
            merge_init_into_class: true
            show_if_no_docstring: true
            show_bases: true
            # Public names only: no private or special members such as __doc__ or __module__,
            # apart from constructors, merged into their class.
            filters: ["!^_", "^__init__$"]
