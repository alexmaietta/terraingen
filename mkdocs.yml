site_name: TerrainGen
site_description: An open-source scientific terrain generation suite for planetary surfaces
site_author: Alex Maietta
site_url: https://alexmaietta.github.io/terraingen/
repo_url: https://github.com/alexmaietta/terraingen
repo_name: GitHub
edit_uri: edit/main/docs/_src/
docs_dir: docs/_src
site_dir: site
strict: true
# Each gallery figure's code page, linked from its caption rather than the nav.
not_in_nav: |
  /gallery/*/*.md
# Write the configuration reference from the built library's schema, the Gallery page from docs/gallery,
# the Guides section's task pages from docs/snippets, the CMake options table from CMakeLists.txt and
# the command line reference from the built `terraingen --help`.
hooks:
  - docs/scripts/generate_schema.py
  - docs/scripts/gallery_page.py
  - docs/scripts/guides.py
  - docs/scripts/cmake_options.py
  - docs/scripts/cli_help.py

theme:
  name: material
  custom_dir: docs/overrides
  language: custom
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false

extra_css:
  - css/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css

# KaTeX renders the equations arithmatex marks; js/katex.js runs it on every page, instant loads too.
extra_javascript:
  - js/katex.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js

