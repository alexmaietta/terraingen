name: Docker

# The Dockerfile's image, built and tested on the oldest supported Ubuntu. Pushes to GHCR tag it dev
# from main, and X.Y.ZrcN or X.Y.Z, X.Y and latest (newest final release only) from v* tags.

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build --target dev -t terraingen:test .
      - name: Smoke test
        run: |
          docker run --rm terraingen:test terraingen --version
          docker run --rm terraingen:test terraingen backends
          docker run --rm terraingen:test python -c "import terraingen; print(terraingen.__version__)"
      - name: Push
        if: >
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags=(dev)
          else
            version=${GITHUB_REF_NAME#v}
            tags=("$version")
            if [[ ! "$version" =~ (a|b|rc)[0-9]+$ ]]; then
              tags+=("${version%.*}")
              # Only the newest final release moves latest, so a 0.2.x patch pushed after 0.3.0
              # does not roll latest back to 0.2.
              newest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' \
                | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
              if [[ "$version" == "$newest" ]]; then
                tags+=(latest)
              fi
            fi
          fi
          for tag in "${tags[@]}"; do
            docker tag terraingen:test "$image:$tag"
            docker push "$image:$tag"
          done
