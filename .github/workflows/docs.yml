name: Docs

# Builds the documentation to check it. The CI workflow deploys it, with the coverage report, to
# GitHub Pages from main.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "terraingen/**/*.h"
      - "terraingen/python/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install TerrainGen and docs requirements
        run: |
          pip install .
          pip install -r docs/requirements.txt

      - name: Build docs
        run: make -C docs build
