name: Docs

# The documentation, built against the Linux wheel of the calling run, and a quick run of every
# gallery script.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-ubuntu-24.04-cp312
          path: wheel
      - name: Install Doxygen, TerrainGen and the docs requirements
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen
          python -m pip install wheel/*.whl -r docs/requirements.txt
      - name: Build
        run: make -C docs build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/terraingen/assets
          key: gallery-assets-${{ hashFiles('docs/gallery/assets.py') }}
      - name: Gallery scripts run
        run: make -C docs gallery-check
