name: CI

# Every push to main or a release-X.Y branch, and every pull request. Releases are published by
# release.yml from v* tags (docs/_src/releases.md).

on:
  push:
    branches: [main, "release-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    uses: ./.github/workflows/version.yml

  lint:
    uses: ./.github/workflows/lint.yml

  build:
    uses: ./.github/workflows/build.yml

  coverage:
    uses: ./.github/workflows/coverage.yml

  wheels:
    uses: ./.github/workflows/wheels.yml

  packages:
    needs: version
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Another platform's wheel failing does not skip the docs.
  docs:
    needs: wheels
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/docs.yml

  docker:
    needs: [lint, build]
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write

  # The docs and coverage report from main, under dev/ on GitHub Pages.
  pages:
    needs: [docs, coverage]
    if: >
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.docs.result == 'success'
    uses: ./.github/workflows/docs-deploy.yml
    with:
      version: dev
      coverage: ${{ needs.coverage.result == 'success' }}
    permissions:
      contents: write
