name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The version's pre-release suffix: .devN on main (N commits since the last release tag), none on
  # release tags (which must match CMakeLists.txt) or pull requests.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        run: |
          project=$(sed -nE 's/^set\(TERRAINGEN_FULL_VERSION "([0-9]+\.[0-9]+\.[0-9]+)"\)$/\1/p' CMakeLists.txt)
          suffix=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$project" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match CMakeLists.txt's version $project"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
              suffix=".dev$(git rev-list --count "$last..HEAD")"
            else
              suffix=".dev$(git rev-list --count HEAD)"
            fi
          fi
          {
            echo "version=$project$suffix"
            echo "suffix=$suffix"
          } >> "$GITHUB_OUTPUT"
          echo "Version $project$suffix"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # Build and every test, with the GPU tests on Mesa's lavapipe, the software Vulkan driver, which
  # TerrainGen uses only when TERRAINGEN_DEVICE names it. The runners have no NVIDIA GPU, so the
  # CUDA kernels are compiled to PTX but not run.
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, compiler and Python.
          - { name: ubuntu-22.04-gcc-11, os: ubuntu-22.04, cc: gcc-11, cxx: g++-11, python: "3.10" }
          - { name: ubuntu-22.04-arm-gcc-11, os: ubuntu-22.04-arm, cc: gcc-11, cxx: g++-11 }
          - { name: ubuntu-24.04-clang-18, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18 }
          - { name: macos-14, os: macos-14 }
          - { name: windows-2022-msvc, os: windows-2022 }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      TERRAINGEN_DEVICE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python || '3.12' }}
      - run: python -m pip install numpy pytest ninja
      # MSVC on the path for the Ninja generator.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        if: runner.os != 'Windows'
        with:
          key: ${{ matrix.name }}
          max-size: 500M
      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n1)
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Install lavapipe
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/install-lavapipe-windows.sh
      - name: Install lavapipe
        if: runner.os == 'macOS'
        run: |
          brew install mesa vulkan-loader
          prefix=$(brew --prefix)
          icd=$(find "$prefix/share/vulkan/icd.d" -name 'lvp_icd*.json' | head -n1)
          {
            echo "VK_DRIVER_FILES=$icd"
            echo "VK_ICD_FILENAMES=$icd"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$prefix/lib"
          } >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTERRAINGEN_BUILD_BENCHMARKS=OFF
          "-DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')"
          ${{ runner.os != 'Windows' && '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}
      - name: Build
        run: cmake --build build --parallel 4
      - name: Backends
        shell: bash
        run: build/bin/terraingen backends
      - name: Test
        run: ctest --test-dir build --parallel 4 --output-on-failure --timeout 1200

  # Line coverage of the library, from the tests on lavapipe; GitHub Pages publishes the report from
  # main (pages job).
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      TERRAINGEN_DEVICE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install gcovr numpy pytest ninja
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: coverage
          max-size: 500M
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTERRAINGEN_COVERAGE=ON
          -DTERRAINGEN_BUILD_BENCHMARKS=OFF
          "-DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      # Everything first: the coverage target builds only the test programs, not the command and
      # examples that the integration tests run.
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test and report
        run: cmake --build build --target coverage
      - name: Summary
        if: always()
        run: cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: build/coverage/
          if-no-files-found: ignore
          retention-days: 7

  # One job per platform and Python (pyproject.toml's [tool.cibuildwheel] has the rest), so each
  # platform's wheels build side by side.
  wheel:
    name: wheel (${{ matrix.os }}, ${{ matrix.python }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-2022]
        python: [cp310, cp311, cp312]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        shell: bash
        run: >
          sed -i.bak -E 's/^set\(TERRAINGEN_FULL_VERSION "([0-9.]+)"\)$/set(TERRAINGEN_FULL_VERSION "\1${{ needs.version.outputs.suffix }}")/'
          CMakeLists.txt
      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  # The sdist, then a wheel built from it and imported, as pip does for platforms without wheels.
  sdist:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Version
        run: >
          sed -i -E 's/^set\(TERRAINGEN_FULL_VERSION "([0-9.]+)"\)$/set(TERRAINGEN_FULL_VERSION "\1${{ needs.version.outputs.suffix }}")/'
          CMakeLists.txt
      - run: python -m pip install build
      - run: python -m build --sdist
      - name: Install from the sdist
        run: |
          python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP" && python -c "import terraingen; print(terraingen.__version__)" && terraingen backends
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  # The documentation, built against the Linux wheel, for every push and pull request.
  docs:
    needs: wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-ubuntu-24.04-cp312
          path: wheel
      - name: Install Doxygen, TerrainGen and the docs requirements
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen
          python -m pip install wheel/*.whl -r docs/requirements.txt
      - name: Build
        run: make -C docs build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 3

  # The documentation with the coverage report under coverage/ (and coverage/badge.json for the
  # README badge), on GitHub Pages from main. A failed coverage run leaves the report out.
  pages:
    needs: [docs, coverage]
    if: ${{ !cancelled() && needs.docs.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: coverage-report
          path: site/coverage
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The CLI, library, headers and CMake package for each platform as an archive, and Debian packages
  # (terraingen, terraingen-dev) built on the oldest supported Ubuntu.
  packages:
    name: packages (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-22.04 }
          - { platform: linux-aarch64, os: ubuntu-22.04-arm }
          - { platform: macos-arm64, os: macos-14 }
          - { platform: macos-x86_64, os: macos-15-intel }
          - { platform: windows-x86_64, os: windows-2022 }
    env:
      ARCHIVE: terraingen-${{ needs.version.outputs.version }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ninja
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - name: Version
        shell: bash
        run: >
          sed -i.bak -E 's/^set\(TERRAINGEN_FULL_VERSION "([0-9.]+)"\)$/set(TERRAINGEN_FULL_VERSION "\1${{ needs.version.outputs.suffix }}")/'
          CMakeLists.txt
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTERRAINGEN_BUILD_TESTS=OFF \
            -DTERRAINGEN_BUILD_BENCHMARKS=OFF -DTERRAINGEN_BUILD_EXAMPLES=OFF \
            -DTERRAINGEN_BUILD_PYTHON=OFF -DTERRAINGEN_INSTALL=ON
          cmake --build build --parallel 4
          cmake --install build --prefix "$ARCHIVE"
          cp LICENSE README.md CHANGELOG.md "$ARCHIVE/"
      - name: Archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "$env:ARCHIVE" -DestinationPath "$env:ARCHIVE.zip"
      - name: Archive
        if: runner.os != 'Windows'
        run: tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
      - name: Debian packages
        if: runner.os == 'Linux'
        run: cpack --config build/CPackConfig.cmake -G DEB -B debs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}
          path: |
            ${{ env.ARCHIVE }}.zip
            ${{ env.ARCHIVE }}.tar.gz
            debs/*.deb
          if-no-files-found: error

  # The Debian packages installed on clean distributions, where the program must run and list its
  # backends. Only the Linux packages matter here, so another platform's failure does not skip it; a
  # missing Linux package fails its download.
  package-test:
    name: package-test (${{ matrix.image }}, ${{ matrix.arch }})
    needs: packages
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-linux-${{ matrix.arch }}
      - name: Install
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./debs/*.deb
      - name: Run
        run: |
          terraingen --version
          terraingen backends

  # The Dockerfile's image, built and tested on the oldest supported Ubuntu; pushed to GHCR from main
  # (dev) and release tags.
  docker:
    needs: [version, lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build --target dev -t terraingen:test .
      - name: Smoke test
        run: |
          docker run --rm terraingen:test terraingen --version
          docker run --rm terraingen:test terraingen backends
          docker run --rm terraingen:test python -c "import terraingen; print(terraingen.__version__)"
      - name: Push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            tags=("$version" "${version%.*}" latest)
          else
            tags=(dev)
          fi
          for tag in "${tags[@]}"; do
            docker tag terraingen:test "$image:$tag"
            docker push "$image:$tag"
          done

  # Wheels and the sdist to PyPI by Trusted Publishing (no stored token): X.Y.Z.devN from main,
  # X.Y.Z from release tags, once every platform's build, tests and packages pass.
  pypi:
    needs: [lint, test, wheel, sdist, package-test]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/terraingenpy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # A GitHub release for each v* tag, with every wheel, the sdist, the packages and their checksums.
  release:
    needs: [lint, test, wheel, sdist, package-test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "wheel-*"
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "packages-*"
          merge-multiple: true
          path: assets
      - name: Flatten
        run: find assets -mindepth 2 -type f -exec mv -t assets {} + && find assets -mindepth 1 -type d -empty -delete
      - name: Checksums
        run: cd assets && sha256sum -- * > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" assets/*
          --repo "$GITHUB_REPOSITORY" --title "TerrainGen ${GITHUB_REF_NAME#v}" --generate-notes
