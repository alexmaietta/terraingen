name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04, GCC 11
            os: ubuntu-22.04
            cc: gcc-11
            cxx: g++-11
          - name: Ubuntu 22.04 ARM64, GCC 11
            os: ubuntu-22.04-arm
            cc: gcc-11
            cxx: g++-11
          - name: Ubuntu 24.04, Clang 18
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
          - name: macOS 14 ARM64, Apple Clang
            os: macos-14
          - name: Windows 2022, MSVC
            os: windows-2022
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # The GPU tests run on Mesa's software Vulkan (lavapipe) on Linux, which TerrainGen only uses
      # when a device is named; the runners have no GPU, so the CUDA tests skip.
      TERRAINGEN_DEVICE: ${{ startsWith(matrix.os, 'ubuntu') && '0' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python test requirements and Ninja
        run: python -m pip install numpy pytest ninja

      - name: Install software Vulkan
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - name: Use the MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.cc }}
          max-size: 500M

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTERRAINGEN_BUILD_BENCHMARKS=OFF
          -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          ${{ runner.os != 'Windows' && '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}

      - name: Build
        run: cmake --build build --parallel 4

      - name: Backends
        shell: bash
        run: build/bin/terraingen backends

      - name: Test
        run: ctest --test-dir build --parallel 4 --output-on-failure --timeout 1200

  coverage:
    name: Coverage (Ubuntu 24.04, GCC)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      TERRAINGEN_DEVICE: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gcovr, Python test requirements and Ninja
        run: python -m pip install gcovr numpy pytest ninja

      - name: Install software Vulkan
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: coverage
          max-size: 500M

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTERRAINGEN_COVERAGE=ON
          -DTERRAINGEN_BUILD_BENCHMARKS=OFF
          -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build, test and report
        run: cmake --build build --target coverage --parallel 4

      - name: Summary
        if: always()
        run: cat build/coverage/summary.md >> "${GITHUB_STEP_SUMMARY}" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: build/coverage/
          if-no-files-found: ignore

  # The documentation site with the coverage report under coverage/ (and coverage/badge.json for the
  # README badge), deployed from main only. Pull requests still run the coverage job above.
  pages:
    name: Docs and coverage to GitHub Pages
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install TerrainGen and docs requirements
        run: |
          pip install .
          pip install -r docs/requirements.txt

      - name: Build docs
        run: make -C docs build

      - name: Add the coverage report
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: coverage-report
          path: site/coverage

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
