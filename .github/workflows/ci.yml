name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04, GCC 11
            os: ubuntu-22.04
            cc: gcc-11
            cxx: g++-11
          - name: Ubuntu 22.04 ARM64, GCC 11
            os: ubuntu-22.04-arm
            cc: gcc-11
            cxx: g++-11
          - name: Ubuntu 24.04, Clang 18
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
          - name: macOS 14 ARM64, Apple Clang
            os: macos-14
          - name: Windows 2022, MSVC
            os: windows-2022
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python test requirements and Ninja
        run: python -m pip install numpy pytest ninja

      - name: Use the MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.cc }}
          max-size: 500M

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTERRAINGEN_BUILD_BENCHMARKS=OFF
          -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          ${{ runner.os != 'Windows' && '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --parallel 4 --output-on-failure --timeout 1200

  coverage:
    name: Coverage (Ubuntu 24.04, GCC)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gcovr, Python test requirements and Ninja
        run: python -m pip install gcovr numpy pytest ninja

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: coverage
          max-size: 500M

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTERRAINGEN_COVERAGE=ON
          -DTERRAINGEN_BUILD_BENCHMARKS=OFF
          -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build, test and report
        run: cmake --build build --target coverage --parallel 4

      - name: Summary
        if: always()
        run: cat build/coverage/summary.md >> "${GITHUB_STEP_SUMMARY}" || true

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage/coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: build/coverage/
          if-no-files-found: ignore
