name: Packages

# The CLI, library, headers and CMake package for each platform as an archive, and Debian packages
# (terraingen, terraingen-dev) built on the oldest supported Ubuntu, then installed on clean
# distributions.

on:
  workflow_call:
    inputs:
      version:
        description: The version in the archive names.
        type: string
        required: true

permissions:
  contents: read

jobs:
  packages:
    name: packages (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-22.04 }
          - { platform: linux-aarch64, os: ubuntu-22.04-arm }
          - { platform: macos-arm64, os: macos-26 }
          - { platform: windows-x86_64, os: windows-2022 }
    env:
      ARCHIVE: terraingen-${{ inputs.version }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ninja
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTERRAINGEN_BUILD_TESTS=OFF \
            -DTERRAINGEN_BUILD_BENCHMARKS=OFF \
            -DTERRAINGEN_BUILD_PYTHON=OFF -DTERRAINGEN_INSTALL=ON
          cmake --build build --parallel 4
          cmake --install build --prefix "$ARCHIVE"
          cp LICENSE README.md CHANGELOG.md "$ARCHIVE/"
      - name: Archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "$env:ARCHIVE" -DestinationPath "$env:ARCHIVE.zip"
      - name: Archive
        if: runner.os != 'Windows'
        run: tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
      - name: Debian packages
        if: runner.os == 'Linux'
        run: cpack --config build/CPackConfig.cmake -G DEB -B debs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}
          path: |
            ${{ env.ARCHIVE }}.zip
            ${{ env.ARCHIVE }}.tar.gz
            debs/*.deb
          if-no-files-found: error

  # Only the Linux packages matter here, so another platform's failure does not skip it, and a
  # missing Linux package fails its download.
  package-test:
    name: package-test (${{ matrix.image }}, ${{ matrix.arch }})
    needs: packages
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-linux-${{ matrix.arch }}
      - name: Install
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./debs/*.deb
      - name: Run
        run: |
          terraingen --version
          terraingen backends
