name: Install NVRTC
description: >-
  Installs NVIDIA's NVRTC, and nothing else of the CUDA toolkit, on an Ubuntu or Windows runner and
  sets CUDAToolkit_ROOT for CMake. The build uses it to compile kernels to PTX for the CUDA backend;
  nothing of it ships, and running needs only the NVIDIA driver.

inputs:
  version:
    description: >-
      CUDA version as major.minor.patch. PTX loads only on drivers at least as new as the NVRTC that
      made it, so this is an early CUDA 12 release.
    default: "12.4.1"

runs:
  using: composite
  steps:
    - name: Install NVRTC (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        . /etc/os-release
        arch="$(uname -m)"
        if [ "${arch}" = aarch64 ]; then arch=sbsa; fi
        minor="${VERSION%.*}"
        repo="https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${VERSION_ID//./}/${arch}"
        wget -q "${repo}/cuda-keyring_1.1-1_all.deb"
        sudo dpkg -i cuda-keyring_1.1-1_all.deb
        rm cuda-keyring_1.1-1_all.deb
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends "cuda-nvrtc-dev-${minor//./-}"
        echo "CUDAToolkit_ROOT=/usr/local/cuda-${minor}" >> "${GITHUB_ENV}"

    - name: Install NVRTC (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        $minor = ($env:VERSION -split '\.')[0..1] -join '.'
        $installer = "cuda_$($env:VERSION)_windows_network.exe"
        Invoke-WebRequest -Uri "https://developer.download.nvidia.com/compute/cuda/$($env:VERSION)/network_installers/$installer" -OutFile $installer
        Start-Process -Wait -FilePath ".\$installer" -ArgumentList "-s", "nvrtc_$minor", "nvrtc_dev_$minor"
        Remove-Item $installer
        $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$minor"
        if (-not (Test-Path "$root\lib\x64\nvrtc.lib")) { throw "NVRTC was not installed under $root" }
        "CUDAToolkit_ROOT=$root" >> $env:GITHUB_ENV
        "CUDA_PATH=$root" >> $env:GITHUB_ENV
        "$root\bin" >> $env:GITHUB_PATH
