name: Bug report
description: Something does not work as documented, crashes, or gives wrong terrain.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        A configuration (JSON), command line or short C++ or Python program that shows it. Attach
        input files if you can share them.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `terraingen --version`, or the Python package's version.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Compiler, Python version, GPU, logs.
